<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Pronunciación diaria</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Azure Cognitive Services Speech SDK -->
  <script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
</head>
<body>
  <div id="app">
    <header class="hero">
      <p class="eyebrow">Español para hablantes de portugués</p>
      <h1>Pronunciación diaria</h1>
      <div class="stat" id="stat"></div>
      <div class="usage" id="usage"></div>
      <div class="cloud" id="cloud" hidden></div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="hoy" aria-selected="true">Hoy</button>
      <button class="tab" role="tab" data-v="hist" aria-selected="false">Historial</button>
      <button class="tab" role="tab" data-v="cfg" aria-selected="false">Ajustes</button>
    </nav>

    <main id="view"></main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
